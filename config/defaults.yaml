# Cấu hình mặc định. Brief AI (S0) override các trường campaign; phần còn lại giữ nguyên.
# Env expansion: ${VAR:-default}. Mọi giá trị đều sửa được, không fix cứng trong code.

kalodata:
  base_url: https://www.kalodata.com
  region: VN
  language: vi-VN
  currency: VND
  rate_per_10s: 30        # spike: 8 worker song song dính 2017 traffic control → giảm tốc + retry backoff
  timeout_s: 60

llm:
  default:
    base_url: ${LLM_BASE_URL:-https://api.anthropic.com/v1/}
    api_key: ${LLM_API_KEY:-}
    model: ${LLM_MODEL:-claude-sonnet-5-5}
    timeout_s: 180
    max_tokens: 4096
    extra: {}             # extra_body passthrough theo provider
  fallback:               # opt-in: đặt env để bật chain dự phòng cho MỌI role.
    model: ${LLM_FALLBACK_MODEL:-}        # model rỗng = không fallback (mặc định)
    base_url: ${LLM_FALLBACK_BASE_URL:-}  # provider khác cũng được
    api_key: ${LLM_FALLBACK_API_KEY:-}
  roles:                  # override từng trường của default; có thể đổi cả base_url/api_key riêng role
    brief:
      model: ${LLM_MODEL_BRIEF:-claude-sonnet-5-5}
      base_url: ${LLM_BRIEF_BASE_URL:-}
      api_key: ${LLM_BRIEF_API_KEY:-}
    screen:
      model: ${LLM_MODEL_SCREEN:-claude-haiku-5-5}
      base_url: ${LLM_SCREEN_BASE_URL:-}
      api_key: ${LLM_SCREEN_API_KEY:-}
    video:
      model: ${LLM_MODEL_VIDEO:-claude-opus-5-5}
      base_url: ${LLM_VIDEO_BASE_URL:-}
      api_key: ${LLM_VIDEO_API_KEY:-}
      max_tokens: 8192
      fallbacks:
        - model: ${LLM_VIDEO_FALLBACK_MODEL:-}
          base_url: ${LLM_VIDEO_FALLBACK_BASE_URL:-}
          api_key: ${LLM_VIDEO_FALLBACK_API_KEY:-}
    reason:
      model: ${LLM_MODEL_REASON:-claude-sonnet-5-5}
      base_url: ${LLM_REASON_BASE_URL:-}
      api_key: ${LLM_REASON_API_KEY:-}
      timeout_s: 300        # S5 tổng hợp 7 KOC + bằng chứng cần timeout và max_tokens lớn hơn
      max_tokens: 8192
      fallbacks:            # opt-in qua env (cùng hoặc khác provider)
        - model: ${LLM_REASON_FALLBACK_MODEL:-}
          base_url: ${LLM_REASON_FALLBACK_BASE_URL:-}
          api_key: ${LLM_REASON_FALLBACK_API_KEY:-}

run:
  as_of: "2026-11-18"     # ghim date_range tuyệt đối → cache bất biến
  seed: 42
  date_range_days: 30

campaign_defaults:        # CHỈ dùng khi S0 degraded (mọi LLM provider fail) — vẫn chạy tiếp, đánh dấu rõ
  product: "kem chống nắng"
  niche_keywords: ["kem chống nắng", "chống nắng", "sunscreen", "spf", "skincare", "chăm sóc da"]
  objective: conversion
  audience: {gender: female, age_range: "18-30", region: VN}

funnel:
  candidates: 30          # demo VỪA hạn mức 13.8 credit (spike đo được); 500 khi scale + thêm credit
  creator_type: INDEPENDENT   # spike: top revenue là brand store (BELONGED_TO_SELLER) — không phải KOC
  slices:                 # lát cắt creator/rank, dedupe sau khi gộp (round-robin giữ đa dạng)
    - {sort: revenue, pages: 1}
    - {sort: content_views, pages: 1}
    - {sort: revenue_growth_rate, pages: 1}
    - {sort: creator_followers, pages: 1, followers_range: "1000-50000"}  # nano
  page_size: 100
  after_2a: 12            # demo vừa credit còn lại (8.1cr); ~100 khi N=500
  after_3: 7              # demo VỪA credit còn lại (8.6cr): 14 video × 0.5 = 7cr; K = max(15, 5%N) khi scale
  videos_fetch: 100       # rank 0,1cr/call bất kể <=100 rows → lấy tối đa, sort ngày client-side
  videos_per_creator: 2   # hôm nay: top_selling + latest; random = knob mở rộng
  video_roles: [top_selling, latest]

scoring:
  weights: {performance: 25, content: 25, visual: 15, audience: 25, collaboration: 10}
  measurable_max: 65      # performance + content + visual; audience/collab không tự chấm
  red_flags:
    min_er: 0.005                 # ER tự tính = (like+comment+share)/view
    min_view_follower_ratio: 0.02
    max_ad_ratio: 0.8             # tỷ lệ video quảng cáo quá dày → cờ uy tín
    competitor_lookback_days: 30

budget:
  total_vnd: 30000000
  max_followers_assumed: 1000000   # lọc sớm theo giá (plan §4.4): mega-influencer rõ ràng ngoài tầm 30tr; biên rộng, chỉ loại ca vượt hẳn
  price_tiers_vnd: {nano: 2000000, micro: 5000000, mid: 6000000, anchor: 7000000}
  tier_followers:                 # GIẢ ĐỊNH minh họa — chỉ tỷ lệ tương đối có ý nghĩa
    nano: [0, 10000]
    micro: [10000, 50000]
    mid: [50000, 150000]
    anchor: [150000, 1000000000]
  scale_scenarios: [0.7, 0.85, 1.0, 1.03, 1.15, 1.3, 1.5]

selection:
  # nano [0,1]: demo pool không còn nano sau red flags (10/30 loại vì ER thấp) —
  # slot nano là ưu tiên, không cứng; relaxation luôn ghi rõ trong report
  slots: {anchor: [1, 2], mid: [1, 3], nano: [0, 1], micro: [0, 3]}   # tổng 5
  backups: 2
  max_per_niche_cluster: 3        # tối đa 3/5 KOC cùng cụm phong cách (đảm bảo giữ đủ KOC đúng ngách chính + tối thiểu 2 KOC đa dạng cụm khác)

audit:
  excluded_sample_pct: 0.10

limits:
  credit_budget: 13.0     # balance thật 13.8 (spike 19/11) — chừa lề retry
  max_ai_usd: 5.0         # trần chi phí AI tối đa mỗi run (Governor)
  max_tokens: 1500000     # trần tổng token in+out mỗi run (Governor)
  max_wall_seconds: 1800  # trần thời gian chạy tối đa 30 phút (Governor)
  max_replans: 3          # số lần Planner được phép kích hoạt replan tối đa (Governor)
  io_concurrency: 4
  llm_concurrency: 6
  asr_workers: 3

asr:
  model: small
  compute_type: int8
  language: vi
  max_video_seconds: 150

video:
  frames: 6               # tổng frame gửi LLM (gồm hook)
  hook_frames: 2          # frame trong 3 giây đầu
  hook_seconds: 3.0
  frame_width: 540        # đòn bẩy token chính: 540x960 ≈ 700 token/frame
  jpeg_quality: 85
